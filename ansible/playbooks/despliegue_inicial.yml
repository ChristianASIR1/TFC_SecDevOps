---
- name: Preparación de Nodos SecDevOps
  hosts: wazuh, podman
  become: yes
  gather_facts: yes

  tasks:
    - name: Actualizar repositorios (apt-update)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar herramientas esenciales
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - net-tools
        state: present

